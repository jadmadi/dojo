version: 2
project_name: dojo

before:
  hooks:
    - go mod tidy

builds:
  - id: dojo
    main: ./cmd/dojo
    binary: dojo
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/jadmadi/dojo/internal/version.DefaultVersion={{.Version}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - CREDITS.md
      - README.md

checksum:
  name_template: "checksums.txt"
